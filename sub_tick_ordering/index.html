<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sub Tick Ordering</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.js"></script>

    <script src="unit_tests.js"></script>
    <script src="order.js"></script>
    <script src="interface.js"></script>


    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="left">
        <!--button class="toggle-btn" id="collapseSidebar">✖</button-->
        <label class="toggle-btn" id="collapseSidebar">x</label>
        <h2>Generate Tilesets</h2>
        <div class="form-row">
            <div>
                <label for="delay">Delay:</label>
                <input type="number" id="delay" name="delay" required min=2 value=2 step=2 />
            </div>
            <div>
                <label for="tiles">Nr. of Diodes:</label>
                <input type="number" id="tiles" name="tiles" required step=1 value=1 min=1 />
            </div>
        </div>

        <label for="angle">Angle (degrees):</label>
        <input type="number" id="theta2" name="theta2" required step=0.1 />

        <!--Uncertainties-->

        <div class="collapsible-label" id="toggle-uncertainties">
            Advanced ▼
        </div>

        <div class="collapsible-content" id="uncertainty-section">
        </div>

        <button type="submit" onclick="run_triangulation()">Generate Tilesets</button>

        <p style=" position: absolute; bottom: 0; left: 10; width: 100%; text-align: left;">
            <a href="" style="color:gray">GitHub</a>
            <a href="https://raw.githubusercontent.com/davidkowalk/end_portal_triangulator/refs/heads/main/LICENSE" style="color:gray">License</a>
            <span style="color: #808080" id="test-results">Unit Tests: <img onclick="runAndDisplayTests()" height="20px" style="cursor: pointer;vertical-align:bottom" src="./img/execute_button.svg" /></span>
        </p>
    </div>

    <div class="right">
        <label class="show-sidebar-btn" id="showSidebar">☰</label>
    </div>



    <script>
        document.querySelectorAll('.collapsible-label').forEach(label => {
            label.addEventListener('click', () => {
                const content = label.nextElementSibling;
                content.classList.toggle('open');
            });
        });
    </script>
    <script src="ui.js"></script>



</body>

</html>
